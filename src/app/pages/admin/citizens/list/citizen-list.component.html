<div class="flex justify-end mb-3">
  <button mat-flat-button color="primary" (click)="goCreate()">Registrar ciudadano</button>
</div>
<app-dynamic-table
  [data]="citizens"
  [columns]="columns"
  [actions]="actions"
  [loading]="loading"
  [totalItems]="total"
  [totalPages]="totalPages"
  [page]="page"
  [pageSize]="pageSize"
  (pageChange)="onPageChange($event)"
  (action)="onTableAction($event)">
</app-dynamic-table>
