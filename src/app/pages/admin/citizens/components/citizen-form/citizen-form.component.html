<mat-card class="cardWithShadow theme-card">
  <div class="p-6">
    <mat-card-title>{{ isEditMode ? 'Editar ciudadano' : 'Registrar ciudadano' }}</mat-card-title>
  </div>
  <mat-card-content class="border-t border-border">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="grid grid-cols-12 gap-x-6">
        <div class="col-span-12 lg:col-span-6">
          <mat-label class="font-semibold mb-2 block">Nombre</mat-label>
          <mat-form-field appearance="outline" class="w-full"><input matInput formControlName="name" /></mat-form-field>
        </div>
        <div class="col-span-12 lg:col-span-6">
          <mat-label class="font-semibold mb-2 block">Correo</mat-label>
          <mat-form-field appearance="outline" class="w-full"><input matInput type="email" formControlName="email" /></mat-form-field>
        </div>
        <div class="col-span-12 lg:col-span-6">
          <mat-label class="font-semibold mb-2 block">Celular</mat-label>
          <mat-form-field appearance="outline" class="w-full"><input matInput formControlName="phone" /></mat-form-field>
        </div>
        <div class="col-span-12 lg:col-span-6">
          <mat-label class="font-semibold mb-2 block">Estado</mat-label>
          <mat-form-field appearance="outline" class="w-full">
            <mat-select formControlName="status">
              <mat-option value="active">Activo</mat-option>
              <mat-option value="inactive">Inactivo</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="col-span-12">
          <mat-label class="font-semibold mb-2 block">Dirección (referencia)</mat-label>
          <mat-form-field appearance="outline" class="w-full"><input matInput formControlName="address" placeholder="Ej: Cra 23 # 62-15" /></mat-form-field>
        </div>
        <div class="col-span-12">
          <mat-label class="font-semibold mb-2 block">Ubicación geográfica</mat-label>
          <app-map-picker
            [latitude]="latitude"
            [longitude]="longitude"
            (locationChange)="onLocationChange($event)">
          </app-map-picker>
          <p class="text-sm mt-2">Lat: {{ form.value.latitude | number:'1.5-5' }} · Lng: {{ form.value.longitude | number:'1.5-5' }}</p>
        </div>
      </div>
      <div class="mt-3 flex gap-2">
        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">Guardar</button>
        <button mat-flat-button color="warn" type="button" (click)="onCancel()">Cancelar</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
