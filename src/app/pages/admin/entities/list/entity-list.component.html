<div class="flex justify-end mb-3">
  <button mat-flat-button color="primary" class="w-52 flex justify-center items-center" (click)="goCreate()">
    Crear entidad
  </button>
</div>

<app-dynamic-table
  [data]="entities"
  [columns]="columns"
  [actions]="actions"
  [loading]="loading"
  [totalItems]="total"
  [totalPages]="totalPages"
  [page]="page"
  [pageSize]="pageSize"
  (pageChange)="onPageChange($event)"
  (action)="onTableAction($event)">
</app-dynamic-table>
