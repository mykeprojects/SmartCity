<mat-card class="cardWithShadow theme-card mb-4" *ngIf="entity">
  <div class="p-6 flex flex-wrap items-center justify-between gap-3">
    <div>
      <mat-card-title class="mb-1">Funcionarios de la entidad</mat-card-title>
      <p class="text-sm text-muted m-0">{{ entity.name }}</p>
    </div>
    <div class="flex gap-2 flex-wrap">
      <button mat-flat-button color="primary" (click)="createOfficial()">Crear funcionario</button>
      <button mat-stroked-button (click)="back()">Volver</button>
    </div>
  </div>
</mat-card>

<mat-card class="cardWithShadow theme-card">
  <mat-card-content class="p-6">
    <p *ngIf="loadingOfficials">Cargando funcionarios...</p>
    <p *ngIf="!loadingOfficials && entityOfficials.length === 0" class="text-muted">
      Esta entidad no tiene funcionarios asociados. Use "Crear funcionario" para registrar uno en esta entidad.
    </p>

    <div class="overflow-x-auto" *ngIf="!loadingOfficials && entityOfficials.length > 0">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Nombre</th>
            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Correo</th>
            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Rol</th>
            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Acciones</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200">
          <tr *ngFor="let official of entityOfficials">
            <td class="px-4 py-2">{{ official.name }}</td>
            <td class="px-4 py-2">{{ official.email }}</td>
            <td class="px-4 py-2">{{ formatRole(official.role) }}</td>
            <td class="px-4 py-2">
              <button mat-stroked-button color="primary" (click)="editOfficial(official)">Editar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </mat-card-content>
</mat-card>
