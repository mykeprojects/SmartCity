<div class="flex flex-col h-[80vh]">

  <div class="flex flex-1 flex-col md:flex-row overflow-hidden">

    <div class="md:w-3/5 flex flex-col bg-gray-100 overflow-hidden min-h-0">
      <div class="h-1/4 min-h-[120px] p-4 border-b bg-white overflow-auto">
        <app-category-filter (selectedCategories)="handleFilterChange($event)"
            (currentCommune)="handleSelectedCommune($event)"
            (currentNeighborhood)="handleSelectedNeighborhood($event)">
        </app-category-filter>
      </div>
      <div class="flex-1 overflow-hidden min-h-0">
        <app-map
          [mapRefreshTrigger]="mapRefreshTrigger"
          [isAnnotationMode]="true"
          [currentCategories]="selectedCategories"
          [filterSelectedCommune] = "selectedCommune"
          [filterSelectedNeighborhood]="selectedNeighborhood"
          (newPoint)="selectNewPoint($event)"
          (selectedPoint)="selectNewAnnotation($event)"
          (newNeighborhood)="handleNewNeighborhood($event)">
        </app-map>
      </div>
    </div>

    <div class="md:w-2/5 bg-white p-6 border-t md:border-t-0 md:border-l overflow-auto">
      <app-map-annotation-form
        [coordinates]="selectedPointCoordinates"
        [annotationForDisplay]="selectedAnnotation"
        [currentNeighborhood]="currentNeighborhood"
        (formSubmit)="handleSubmit($event)">
      </app-map-annotation-form>

      <app-vote-form
        [currentAnnotation]="selectedAnnotation">
      </app-vote-form>
    </div>

  </div>

</div>
