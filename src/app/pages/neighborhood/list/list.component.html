<div class="max-w-7xl mx-auto p-6 space-y-6">

  <!-- Contenedor del Encabezado y Botón -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pb-4 border-b border-gray-100">
    <div>
      <h1 class="text-2xl font-bold text-slate-950">Gestión de Barrios</h1>
      <p class="text-sm text-gray-500 mt-1">Administra la lista de barrios y sus comunas asociadas.</p>
    </div>
    
    <!-- Botón de Redirección -->
    <button type="button"
            (click)="irACrearBarrio()"
            class="inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm px-4 py-2.5 rounded-lg shadow-sm transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 active:scale-95">
      <!-- Icono de Más (+) -->
      <svg xmlns="http://w3.org" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
      <span>Nuevo Barrio</span>
    </button>
  </div>

  <!-- Contenedor de tu Tabla Dinámica -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <app-dynamic-table
        [data] = "neighborhoodsToList"
        [columns] = "columns"
        [actions] = "actions"
        [loading] = "loading"
        [totalItems] = "total"
        [totalPages] = "totalPages"
        [page] = "page"
        [pageSize] = "pageSize"
        (pageChange) = "onPageChange($event)"
        (action) = "onTableAction($event)">
    </app-dynamic-table>
  </div>

</div>
