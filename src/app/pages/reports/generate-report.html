<div class="h-screen flex flex-col">

  <div class="h-[65%] overflow-y-auto p-4">

    @if (loading) {
      <div class="flex flex-col items-center justify-center h-full gap-3">

        <div class="h-10 w-10 animate-spin rounded-full border-4 border-blue-500 border-t-transparent"></div>

        <p class="font-medium text-blue-600">
          Generando reporte...
        </p>

      </div>
    }

    @else if (report) {
      <app-chart [report]="report"></app-chart>
    }

    @else {
      <div class="flex items-center gap-3 rounded-lg border border-blue-200 bg-blue-50 px-4 py-3 text-blue-700 shadow-sm">
        <div>
          <p class="font-medium">No hay un reporte aún</p>
          <p class="text-sm text-blue-600">
            Escribe un prompt y presiona “Enviar” para generar el análisis.
          </p>
        </div>
      </div>
    }

  </div>

<div class="h-[20%] border-t bg-white p-4">
  <div class="flex flex-col h-full">

    <textarea [(ngModel)]="prompt" class="flex-1 resize-none rounded-lg border p-3" (keydown.enter)="onEnter($event)"></textarea>

    <div class="mt-2 flex justify-end">
      <button mat-raised-button color="primary"(click)="sendPrompt()">
        Enviar
      </button>
    </div>

  </div>
</div>

</div>
